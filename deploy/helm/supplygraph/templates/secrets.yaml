{{- if and .Values.api.token.value (not .Values.api.token.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "supplygraph.tokenSecret" . }}
  labels: {{- include "supplygraph.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.api.token.existingSecretKey }}: {{ .Values.api.token.value | quote }}
{{- end }}
{{- if and .Values.secrets.values (not .Values.secrets.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "supplygraph.fullname" . }}-env
  labels: {{- include "supplygraph.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets.values }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
