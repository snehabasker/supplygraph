apiVersion: v1
kind: Pod
metadata:
  name: {{ include "supplygraph.fullname" . }}-test
  labels: {{- include "supplygraph.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext: {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: check
      image: {{ include "supplygraph.image" . }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      securityContext: {{- toYaml .Values.securityContext | nindent 8 }}
      command:
        - python
        - -c
        - |
          import json, urllib.request
          base = "http://{{ include "supplygraph.fullname" . }}:{{ .Values.service.port }}"
          def get(path):
              with urllib.request.urlopen(base + path, timeout=10) as r:
                  return r.read().decode()
          assert json.loads(get("/readyz"))["status"] == "ready"
          summary = json.loads(get("/api/summary"))
          assert summary["companies"] > 0, summary
          assert "supplygraph_rows" in get("/metrics")
          assert 'id="root"' in get("/")
          print("ok:", summary["companies"], "companies,", summary["at_risk"], "at risk")
