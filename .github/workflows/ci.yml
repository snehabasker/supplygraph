name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/ci-password-123
        ports:
          - 7687:7687
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      SUPPLYGRAPH_INTEGRATION: "1"
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ci-password-123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Validate Dagster definitions
        run: dagster definitions validate -m supplygraph.orchestration.definitions
      - name: Tests (unit + Neo4j integration)
        run: pytest --cov=supplygraph --cov-report=term-missing
