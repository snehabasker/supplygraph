name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/ci-password-123
        ports:
          - 7687:7687
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      SUPPLYGRAPH_INTEGRATION: "1"
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ci-password-123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Validate Dagster definitions
        run: dagster definitions validate -m supplygraph.orchestration.definitions
      - name: Tests (unit + Neo4j integration)
        run: pytest --cov=supplygraph --cov-report=term-missing

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Typecheck + build
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint and render the chart (defaults and all options on)
        run: |
          helm lint deploy/helm/supplygraph
          helm lint deploy/helm/supplygraph --set api.token.value=x \
            --set metrics.serviceMonitor.enabled=true --set metrics.prometheusRule.enabled=true \
            --set ingress.enabled=true --set secrets.values.SEC_USER_AGENT=y \
            --set pipeline.loadGraph=true --set neo4j.uri=bolt://neo4j:7687
          helm template sg deploy/helm/supplygraph --set api.token.value=x > /dev/null
      - name: Build the image
        run: docker build -t supplygraph:ci .
      - name: Smoke-test the image (demo data, read-only rootfs)
        run: |
          docker volume create sgdata
          docker run --rm -v sgdata:/data supplygraph:ci demo-data
          docker run -d --name sg -p 8000:8000 -v sgdata:/data --read-only --tmpfs /tmp supplygraph:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/readyz && break; sleep 1; done
          curl -fs localhost:8000/readyz
          curl -fs localhost:8000/metrics | grep -q 'supplygraph_rows{kind="companies"} 278.0'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/api/ask \
            -H 'Content-Type: application/json' -d '{"question":"q"}')" = 403
