[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "supplygraph"
version = "0.1.0"
description = "Supplier risk intelligence: an ontology-backed knowledge graph over corporate ownership, sanctions, filings and news."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27,<1",
    "duckdb>=1.1,<2",
    "neo4j>=5.20,<6",
    "typer>=0.12,<1",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
supplygraph = "supplygraph.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/supplygraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI options via default values; that's the intended API.
extend-immutable-calls = ["typer.Option", "typer.Argument"]
