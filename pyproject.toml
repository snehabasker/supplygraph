[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "supplygraph"
version = "0.8.0"
description = "Supplier risk intelligence: an ontology-backed knowledge graph over corporate ownership, sanctions, filings and news."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27,<1",
    "duckdb>=1.1,<2",
    "neo4j>=5.20,<6",
    "typer>=0.12,<1",
    "python-dotenv>=1.0,<2",
    "rapidfuzz>=3.9,<4",
]

[project.optional-dependencies]
orchestration = [
    "dagster>=1.9,<2",
    "dagster-webserver>=1.9,<2",
]
llm = [
    "anthropic>=1.17,<2",
]
tracking = [
    "mlflow>=3.1,<4",
]
vectors = [
    "psycopg[binary]>=3.2,<4",
]
worker = [
    "celery[redis]>=5.4,<6",
]
mcp = [
    "mcp>=2.3,<3",
]
ui = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "prometheus-client>=0.20,<1",
]
dev = [
    "supplygraph[orchestration,llm,ui,tracking,vectors,worker,mcp]",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
supplygraph = "supplygraph.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/supplygraph"]

[tool.dagster]
module_name = "supplygraph.orchestration.definitions"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Cyrillic text is the point here (transliteration tables, Russian company-name fixtures).
"src/supplygraph/er/normalize.py" = ["RUF001"]
"tests/test_er.py" = ["RUF001"]

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI options via default values; that's the intended API.
extend-immutable-calls = ["typer.Option", "typer.Argument"]
