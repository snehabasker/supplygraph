services:
  neo4j:
    image: neo4j:5.26-community
    container_name: supplygraph-neo4j
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-change-me-please}
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Optional: vector candidate generation for entity resolution (`evaluate-er --vectors`).
  pgvector:
    image: pgvector/pgvector:0.8.1-pg17
    container_name: supplygraph-pgvector
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: supplygraph
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:-change-me-please}
      POSTGRES_DB: supplygraph
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supplygraph -d supplygraph"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  neo4j-data:
  pgvector-data:
